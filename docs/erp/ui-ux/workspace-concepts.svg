<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Kit Studio and Packing workspace concepts</title><desc id="desc">Kit Studio links separate educational and physical structures through selected-node associations. Packing retains destination, hierarchy and selected-package checklist context. Generic proposed wireframes, not working prototypes.</desc>
<rect width="1200" height="730" fill="#f1f5f9"/><g font-family="Arial, sans-serif" fill="#0f172a">
<text x="24" y="32" font-size="21" font-weight="bold">Kit Studio · linked structures, explicit quantity and revision</text>
<rect x="20" y="48" width="1160" height="292" rx="8" fill="white" stroke="#cbd5e1"/><text x="36" y="77" font-size="15">Science Kit / Draft r3 · Saved</text><text x="738" y="77" font-size="14">Preview quantities   |   Save draft   |   Review approval</text><path d="M20 94H1180 M300 94V340 M780 94V340" stroke="#cbd5e1"/>
<text x="36" y="122" font-size="15" font-weight="bold">Learning structure</text><text x="36" y="152" font-size="14">Science → Grade 8</text><text x="51" y="182" font-size="14">Activity A → Material X</text><text x="51" y="212" font-size="14">Activity B → Material X</text><text x="36" y="253" font-size="13">Educational usage ≠ extra placement</text><text x="36" y="310" font-size="13">Move / Add / Find usages</text>
<text x="320" y="122" font-size="15" font-weight="bold">Packing structure / Mapping</text><text x="320" y="152" font-size="14">Common crate → Compartment</text><rect x="336" y="170" width="422" height="55" rx="4" fill="#eef2ff" stroke="#4338ca"/><text x="350" y="193" font-size="14">Pouch 2 · shared by Activity A + Activity B</text><text x="350" y="213" font-size="12">Material X placed once under its configured rule</text><text x="320" y="255" font-size="13">Placement does not multiply demand</text><text x="320" y="310" font-size="13">Separate navigable views on tablet · no drag-only actions</text>
<text x="800" y="122" font-size="15" font-weight="bold">Selected-node inspector</text><text x="800" y="152" font-size="14">Identity / unit / associations</text><text x="800" y="183" font-size="14">Rule: per selected grade set</text><text x="800" y="214" font-size="14">Preview trace: site → rule → item</text><text x="800" y="255" font-size="13">Universal crate: explicit complete sets</text><text x="800" y="310" font-size="13">Approved versions remain immutable</text>
<text x="24" y="383" font-size="21" font-weight="bold">Packing &amp; QC · destination and target stay visible</text><rect x="20" y="400" width="1160" height="287" rx="8" fill="white" stroke="#cbd5e1"/><text x="36" y="430" font-size="15">Project North / School A / Batch 2 · r5 · Active</text><text x="840" y="430" font-size="14">Lookup package  |  Audit  |  Labels</text><path d="M20 447H1180 M300 447V687 M780 447V687" stroke="#cbd5e1"/>
<text x="36" y="477" font-size="15" font-weight="bold">Package hierarchy</text><text x="36" y="508" font-size="14">Common crate 2</text><text x="51" y="539" font-size="14">Compartment 1</text><rect x="51" y="551" width="225" height="35" rx="4" fill="#eef2ff"/><text x="65" y="574" font-size="14">Pouch 2 · selected</text><text x="36" y="626" font-size="13">Bulk scope: explicit count + site</text>
<text x="320" y="477" font-size="15" font-weight="bold">Pouch 2 · full identity available</text><text x="320" y="509" font-size="14">Required / Picked / Packed / QC / Remaining</text><text x="320" y="541" font-size="14">Material, unit, eligible location</text><text x="320" y="576" font-size="14">Assembly checklist / exception and correction</text><text x="320" y="626" font-size="13">Pending → confirmed server result; preserve retry identity</text><text x="320" y="657" font-size="13">Tablet: list → focused detail with persistent context</text>
<text x="800" y="477" font-size="15" font-weight="bold">Inspector / next permitted action</text><text x="800" y="509" font-size="14">Six existing QC checks + evidence</text><text x="800" y="541" font-size="14">Unresolved exceptions remain visible</text><rect x="800" y="563" width="358" height="48" rx="5" fill="#4338ca"/><text x="814" y="593" font-size="14" fill="white">Review action and selected package</text><text x="800" y="643" font-size="13">Role guards / revision / reason preserved</text></g></svg>
